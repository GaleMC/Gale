gradle.projectsEvaluated {
    def server = gradle.rootProject.findProject(':gale-server')
    if (server == null) return

    def sourceSets = server.extensions.getByType(org.gradle.api.tasks.SourceSetContainer)
    def benchmark = sourceSets.create('pathfindingBenchmark')
    benchmark.java.srcDir(server.file('src/jmh/java'))
    benchmark.compileClasspath += sourceSets.test.output + sourceSets.test.runtimeClasspath
    benchmark.runtimeClasspath += sourceSets.test.output + sourceSets.test.runtimeClasspath

    server.dependencies.add(benchmark.implementationConfigurationName, 'org.openjdk.jmh:jmh-core:1.37')
    server.dependencies.add(benchmark.annotationProcessorConfigurationName, 'org.openjdk.jmh:jmh-generator-annprocess:1.37')

    server.tasks.register('pathfindingBenchmark', JavaExec) {
        dependsOn server.tasks.named(benchmark.classesTaskName), server.tasks.named('testClasses')
        classpath = benchmark.runtimeClasspath
        mainClass = 'org.openjdk.jmh.Main'
        workingDir = temporaryDir
        def report = server.layout.buildDirectory.file('reports/pathfinding-jmh.json')
        args 'org.galemc.gale.pathfinding.PathFinderBenchmark', '-foe', 'true', '-prof', 'gc', '-rf', 'json', '-rff', report.get().asFile.absolutePath
        if (server.hasProperty('jmhArgs')) {
            setArgs(server.property('jmhArgs').toString().split('\\s+') as List)
        }
        doFirst {
            report.get().asFile.parentFile.mkdirs()
        }
    }
}
